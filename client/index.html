<!DOCTYPE html>
<!-- Created by Erion Nezha — © 2026 All rights reserved -->
<html lang="sq">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — Asistenti yt me zë</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(1200px 800px at 50% 20%, #0e2a4a 0%, #05080f 60%, #030509 100%);
    color: #e8f1ff; min-height: 100vh;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 24px; text-align: center;
  }
  h1 { font-size: 2.6rem; letter-spacing: .35em; margin-bottom: 6px; color: #7fd4ff;
       text-shadow: 0 0 24px rgba(127,212,255,.55); }
  .sub { color: #8fa3bd; margin-bottom: 34px; font-size: .95rem; }
  #orb {
    width: 170px; height: 170px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #9be7ff, #2f9df0 45%, #0b2c52 100%);
    box-shadow: 0 0 60px rgba(80,180,255,.35), inset 0 0 40px rgba(255,255,255,.15);
    margin-bottom: 30px; transition: transform .3s, box-shadow .3s;
    animation: breathe 4s ease-in-out infinite;
  }
  @keyframes breathe {
    0%,100% { transform: scale(1); box-shadow: 0 0 50px rgba(80,180,255,.28), inset 0 0 40px rgba(255,255,255,.15); }
    50% { transform: scale(1.04); box-shadow: 0 0 80px rgba(80,180,255,.5), inset 0 0 40px rgba(255,255,255,.2); }
  }
  #orb.speaking { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse {
    0%,100% { transform: scale(1); box-shadow: 0 0 60px rgba(80,180,255,.35); }
    50% { transform: scale(1.08); box-shadow: 0 0 110px rgba(80,180,255,.7); }
  }
  #stars { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
  #micBtn {
    font-size: 1.15rem; padding: 16px 46px; border-radius: 999px; border: none;
    cursor: pointer; color: #04121f; font-weight: 700;
    background: linear-gradient(135deg, #9be7ff, #3fa9f5);
    box-shadow: 0 6px 30px rgba(80,180,255,.4);
  }
  #micBtn.off { background: linear-gradient(135deg, #ff9d9d, #f56363); color: #2a0808; }
  #micBtn:disabled { opacity: .45; cursor: wait; }
  #status { margin-top: 22px; min-height: 1.6em; color: #a9c6e8; font-size: .95rem; max-width: 520px; }
  audio { display: none; }
</style>
</head>
<body>
  <canvas id="stars"></canvas>
  <h1>JARVIS</h1>
  <div class="sub">asistenti personal me zë — krijuar nga Mr.Erionxx</div>
  <div id="orb"></div>
  <button id="micBtn" disabled>⏳ Po lidhem…</button>
  <div id="status">Duke u lidhur me serverin…</div>

<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.9.3/dist/livekit-client.umd.min.js"></script>
<script>
// Grimca sfondi — vetëm vizuale, s'prek logjikën e zërit
(function () {
  var cv = document.getElementById('stars');
  var ctx = cv.getContext('2d');
  var P = [], N = 70;
  function size() { cv.width = innerWidth; cv.height = innerHeight; }
  size(); addEventListener('resize', size);
  for (var i = 0; i < N; i++) P.push({
    x: Math.random() * innerWidth, y: Math.random() * innerHeight,
    r: Math.random() * 1.8 + .4, s: Math.random() * .35 + .08,
    o: Math.random() * .5 + .15
  });
  (function tick() {
    ctx.clearRect(0, 0, cv.width, cv.height);
    for (var i = 0; i < N; i++) {
      var p = P[i];
      p.y -= p.s; if (p.y < -4) { p.y = cv.height + 4; p.x = Math.random() * cv.width; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283);
      ctx.fillStyle = 'rgba(127,212,255,' + p.o + ')'; ctx.fill();
    }
    requestAnimationFrame(tick);
  })();
})();
</script>
<script>
(function () {
  var statusEl = document.getElementById('status');
  var btn = document.getElementById('micBtn');
  var orb = document.getElementById('orb');

  function setStatus(t) { statusEl.textContent = t; }

  var room = null, micOn = false;
  var audioCtx = null;

  // Zhbllokon audion e shfletuesit (Chrome bllokon play() pa gjest përdoruesi)
  function unlockAudio() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    } catch (e) {}
    // Ri-provo play() për çdo audio ekzistuese
    Array.prototype.forEach.call(document.getElementsByTagName('audio'), function (el) {
      el.muted = false; el.volume = 1.0;
      var p = el.play(); if (p) p.catch(function(){});
    });
  }

  function attachAudio(track) {
    var el = track.attach();
    el.style.display = 'none';
    el.volume = 1.0;
    el.muted = false;
    document.body.appendChild(el);
    unlockAudio();
    var p = el.play();
    if (p) p.catch(function (err) { console.error('audio play:', err); });
  }

  btn.addEventListener('click', function () {
    if (!room) return;
    unlockAudio();
    micOn = !micOn;
    room.localParticipant.setMicrophoneEnabled(micOn).then(function () {
      btn.textContent = micOn ? '🔴 NDALO' : '🎤 FOL';
      btn.classList.toggle('off', micOn);
      setStatus(micOn ? 'Po të dëgjoj… fol lirshëm.' : 'Mikrofoni fikur. Shtyp FOL për të folur.');
    });
  });

  fetch('/token').then(function (r) { return r.json(); }).then(function (data) {
    if (data.error) { setStatus('❌ ' + data.error); return; }
    if (!data.url) { setStatus('❌ LIVEKIT_URL mungon në .env'); return; }
    room = new LivekitClient.Room({ adaptiveStream: true, dynacast: true });

    room.on(LivekitClient.RoomEvent.TrackSubscribed, function (track) {
      if (track.kind === LivekitClient.Track.Kind.Audio) {
        attachAudio(track);
        orb.classList.add('speaking');
        setStatus('Jarvis po flet…');
      }
    });
    room.on(LivekitClient.RoomEvent.TrackUnsubscribed, function (track) {
      if (track.kind === LivekitClient.Track.Kind.Audio) orb.classList.remove('speaking');
    });
    room.on(LivekitClient.RoomEvent.ActiveSpeakersChanged, function (speakers) {
      var agentSpeaking = speakers.some(function (p) { return !p.isLocal; });
      orb.classList.toggle('speaking', agentSpeaking);
      if (agentSpeaking) setStatus('Jarvis po flet…');
      else if (micOn) setStatus('Po të dëgjoj… fol lirshëm.');
    });
    room.on(LivekitClient.RoomEvent.Disconnected, function () {
      setStatus('❌ Lidhja u ndërpre. Rifresko faqen.');
      btn.disabled = true;
    });

    return room.connect(data.url, data.token);
  }).then(function () {
    if (!room) return;
    setStatus('✅ I lidhur! Shtyp FOL dhe fol shqip.');
    btn.disabled = false;
    btn.textContent = '🎤 FOL';
  }).catch(function (err) {
    setStatus('❌ Dështoi lidhja: ' + (err && err.message ? err.message : err));
    console.error(err);
  });
})();
</script>
</body>
</html>
